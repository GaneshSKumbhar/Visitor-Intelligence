<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Intelligence Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:transparent;
    display:flex;justify-content:center;align-items:center;
    padding:10px 0;
    color:#e2e8f0;
    overflow:hidden;
}
.auth-container{
    width:100%;max-width:460px;margin:0 auto;
}
.auth-card{
    background:linear-gradient(145deg,rgba(22,27,46,0.95),rgba(15,17,23,0.98));
    border:1px solid rgba(99,102,241,0.22);
    border-radius:24px;
    padding:2.2rem 2.4rem;
    box-shadow:0 24px 64px rgba(0,0,0,0.5),0 0 32px rgba(99,102,241,0.12);
    backdrop-filter:blur(24px);
    position:relative;
    overflow:hidden;
}
.auth-card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4);
}
.header-area{text-align:center;margin-bottom:1.8rem;}
.brand-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 12px;border-radius:99px;
    background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.25);
    font-size:0.7rem;font-weight:700;color:#a5b4fc;
    letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;
}
.logo-icon{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:24px;color:#fff;font-weight:900;
    box-shadow:0 8px 28px rgba(99,102,241,0.4);
    margin-bottom:10px;letter-spacing:-0.02em;
}
.logo-title{font-size:1.45rem;font-weight:800;color:#f8fafc;letter-spacing:-0.03em;margin-bottom:4px;}
.logo-sub{font-size:0.83rem;color:#94a3b8;line-height:1.4;}

/* Google Button */
.btn-google{
    width:100%;padding:0.85rem 1.2rem;
    border:1px solid rgba(148,163,184,0.18);
    border-radius:14px;
    background:linear-gradient(180deg,rgba(30,41,59,0.85),rgba(20,27,45,0.95));
    color:#f1f5f9;font-size:0.94rem;font-weight:600;font-family:inherit;
    cursor:pointer;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
    display:flex;align-items:center;justify-content:center;gap:0.75rem;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
}
.btn-google:hover{
    border-color:rgba(99,102,241,0.45);
    background:linear-gradient(180deg,rgba(40,53,75,0.95),rgba(26,34,56,0.98));
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(99,102,241,0.2);
}
.btn-google:active{transform:translateY(0);}
.btn-google svg{width:20px;height:20px;flex-shrink:0;}

.divider{
    display:flex;align-items:center;gap:1rem;margin:1.4rem 0;
    color:#64748b;font-size:0.78rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(148,163,184,0.12);}

/* Tab switcher */
.tabs{display:flex;background:rgba(15,23,42,0.65);border:1px solid rgba(148,163,184,0.1);border-radius:12px;padding:4px;margin-bottom:1.3rem;}
.tab{
    flex:1;padding:0.6rem 0.8rem;text-align:center;font-size:0.85rem;font-weight:600;
    color:#94a3b8;cursor:pointer;border-radius:8px;transition:all 0.2s ease;
    border:none;background:none;font-family:inherit;
}
.tab.active{background:linear-gradient(135deg,rgba(99,102,241,0.25),rgba(139,92,246,0.25));color:#c7d2fe;box-shadow:0 2px 8px rgba(0,0,0,0.2);}

/* Form */
.form-group{margin-bottom:1rem;}
.form-group label{
    display:block;font-size:0.8rem;font-weight:600;color:#94a3b8;
    margin-bottom:0.35rem;letter-spacing:0.01em;
}
.input-wrap{position:relative;}
.form-group input{
    width:100%;padding:0.75rem 1rem;
    background:rgba(15,23,42,0.6);
    border:1px solid rgba(148,163,184,0.15);
    border-radius:12px;color:#f1f5f9;
    font-size:0.9rem;font-family:inherit;
    transition:all 0.2s ease;outline:none;
}
.form-group input:focus{
    border-color:rgba(99,102,241,0.5);
    box-shadow:0 0 0 3px rgba(99,102,241,0.15);
    background:rgba(15,23,42,0.85);
}
.form-group input::placeholder{color:#475569;}

.btn-primary{
    width:100%;padding:0.85rem;border:none;border-radius:12px;
    background:linear-gradient(135deg,#6366f1 0%,#7c3aed 100%);
    color:#fff;font-size:0.94rem;font-weight:700;font-family:inherit;
    cursor:pointer;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow:0 4px 20px rgba(99,102,241,0.35);
    margin-top:0.4rem;
}
.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 30px rgba(99,102,241,0.5);
}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled,.btn-google:disabled{opacity:0.6;cursor:not-allowed;transform:none!important;}

.btn-guest{
    width:100%;padding:0.65rem;border:1px dashed rgba(99,102,241,0.3);border-radius:12px;
    background:rgba(99,102,241,0.06);color:#a5b4fc;font-size:0.82rem;font-weight:600;
    cursor:pointer;margin-top:0.8rem;transition:all 0.2s ease;font-family:inherit;
}
.btn-guest:hover{background:rgba(99,102,241,0.14);border-color:rgba(99,102,241,0.5);color:#fff;}

/* Feedback messages */
.error-msg{
    background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);
    border-radius:10px;padding:0.75rem 1rem;margin-bottom:1rem;
    color:#fca5a5;font-size:0.82rem;display:none;line-height:1.45;
}
.success-msg{
    background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);
    border-radius:10px;padding:0.75rem 1rem;margin-bottom:1rem;
    color:#6ee7b7;font-size:0.82rem;display:none;line-height:1.45;
}

.loading{display:none;text-align:center;padding:0.6rem;color:#a5b4fc;font-size:0.85rem;}
.loading.show{display:block;}

@keyframes spin{to{transform:rotate(360deg);}}
.spinner{
    display:inline-block;width:16px;height:16px;border:2px solid rgba(99,102,241,0.3);
    border-top-color:#6366f1;border-radius:50%;animation:spin 0.6s linear infinite;
    vertical-align:middle;margin-right:8px;
}

.auth-footer{
    text-align:center;margin-top:1.4rem;padding-top:1rem;
    border-top:1px solid rgba(148,163,184,0.08);
    font-size:0.72rem;color:#64748b;line-height:1.5;
}
.auth-footer span{color:#818cf8;font-weight:600;}
</style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="header-area">
            <div class="brand-badge">⚡ AI-POWERED PLATFORM</div>
            <div class="logo-icon">VI</div>
            <h1 class="logo-title">Visitor Intelligence</h1>
            <p class="logo-sub">Sign in to access real-time session purchase intent scoring & predictive analytics</p>
        </div>

        <div id="error-box" class="error-msg"></div>
        <div id="success-box" class="success-msg"></div>

        <!-- Google One-Click Button -->
        <button class="btn-google" id="btn-google" onclick="loginGoogle()">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div class="divider">or email credentials</div>

        <!-- Sign In / Sign Up Tabs -->
        <div class="tabs">
            <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
            <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <!-- Login Form -->
        <div id="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="name@company.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <div id="login-loading" class="loading"><span class="spinner"></span>Authenticating with Firebase…</div>
            <button class="btn-primary" id="btn-login" onclick="loginEmail()">Sign In to Dashboard</button>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" style="display:none">
            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" placeholder="name@company.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="signup-password">Password (min. 6 characters)</label>
                <input type="password" id="signup-password" placeholder="Create strong password" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="signup-confirm">Confirm Password</label>
                <input type="password" id="signup-confirm" placeholder="Repeat password" autocomplete="new-password">
            </div>
            <div id="signup-loading" class="loading"><span class="spinner"></span>Creating your account…</div>
            <button class="btn-primary" id="btn-signup" onclick="signupEmail()">Create Account</button>
        </div>

        <!-- Guest Shortcut -->
        <button class="btn-guest" onclick="loginGuest()">⚡ Quick Demo / Guest Access</button>

        <div class="auth-footer">
            Secured by <span>Google Firebase Authentication</span><br>
            Project: <strong style="color:#cbd5e1">webannage</strong> · Zero data leakage
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
// Firebase credentials from user project
const firebaseConfig = {
    apiKey: "AIzaSyBWlZmKjZbFcVMgfYQaY8G2gE38PgyhnxQ",
    authDomain: "webannage.firebaseapp.com",
    projectId: "webannage",
    storageBucket: "webannage.firebasestorage.app",
    messagingSenderId: "277770633307",
    appId: "1:277770633307:web:3314be2367407891693f7e",
    measurementId: "G-L22JWPZNQK"
};

let auth = null;
try {
    if (window.firebase) {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        auth = firebase.auth();
    }
} catch (e) {
    console.warn("Firebase init note:", e);
}

// Streamlit custom component communication protocol
function sendToStreamlit(value) {
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value
    }, "*");
}

function sendHeight() {
    const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 30;
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: height
    }, "*");
}

function notifyReady() {
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
    }, "*");
    sendHeight();
}

window.addEventListener("message", function(e) {
    if (e.data && e.data.type === "streamlit:render") {
        sendHeight();
        if (e.data.args && e.data.args.logout_signal) {
            handleSignOut();
        }
    }
});

function handleSignOut() {
    try {
        if (auth) {
            auth.signOut().then(function() {
                console.log("Firebase signed out cleanly.");
            }).catch(function(err) {
                console.warn("SignOut notice:", err);
            });
        }
    } catch (e) {
        console.warn("SignOut error:", e);
    }
    try {
        localStorage.removeItem("vi_auth_user");
        sessionStorage.removeItem("vi_auth_user");
    } catch (e) {}
    clearMessages();
    disableButtons(false);
}

document.addEventListener("DOMContentLoaded", () => {
    notifyReady();
    setTimeout(sendHeight, 150);
});
window.addEventListener("load", () => {
    notifyReady();
    setTimeout(sendHeight, 200);
});
window.addEventListener("resize", sendHeight);

// UI Helpers
function showError(msg) {
    const b = document.getElementById("error-box");
    b.textContent = msg;
    b.style.display = "block";
    document.getElementById("success-box").style.display = "none";
    sendHeight();
}

function showSuccess(msg) {
    const b = document.getElementById("success-box");
    b.textContent = msg;
    b.style.display = "block";
    document.getElementById("error-box").style.display = "none";
    sendHeight();
}

function clearMessages() {
    document.getElementById("error-box").style.display = "none";
    document.getElementById("success-box").style.display = "none";
}

function setLoading(id, show) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("show", show);
}

function disableButtons(disable) {
    document.querySelectorAll(".btn-primary, .btn-google, .btn-guest").forEach(b => b.disabled = disable);
}

function switchTab(mode) {
    clearMessages();
    document.getElementById("tab-login").classList.toggle("active", mode === "login");
    document.getElementById("tab-signup").classList.toggle("active", mode === "signup");
    document.getElementById("login-form").style.display = mode === "login" ? "block" : "none";
    document.getElementById("signup-form").style.display = mode === "signup" ? "block" : "none";
    sendHeight();
}

function formatUser(u, providerId) {
    return {
        email: u.email || "",
        name: u.displayName || (u.email ? u.email.split("@")[0] : "User"),
        uid: u.uid || "",
        photo: u.photoURL || null,
        provider: providerId || (u.providerData && u.providerData[0] ? u.providerData[0].providerId : "password")
    };
}

// Google Sign-In
function loginGoogle() {
    clearMessages();
    if (!auth) {
        showError("Firebase service is initializing. Please wait a moment or use email sign-in.");
        return;
    }
    disableButtons(true);
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    auth.signInWithPopup(provider)
        .then(result => {
            showSuccess("Signed in with Google! Redirecting to dashboard…");
            const payload = formatUser(result.user, "google.com");
            setTimeout(() => sendToStreamlit(payload), 400);
        })
        .catch(err => {
            console.error("Google sign in error:", err);
            if (err.code === "auth/popup-closed-by-user") {
                showError("Sign-in popup was closed. Please try again.");
            } else if (err.code === "auth/popup-blocked") {
                showError("Popup was blocked by your browser. Please allow popups or use Email/Password below.");
            } else if (err.code === "auth/unauthorized-domain") {
                showError("This domain is not in Firebase's Authorized Domains list. Please add localhost in Firebase Console -> Auth -> Settings.");
            } else {
                showError(err.message || "Google sign-in failed. Please try Email/Password.");
            }
        })
        .finally(() => disableButtons(false));
}

// Email/Password Login
function loginEmail() {
    clearMessages();
    const email = document.getElementById("login-email").value.trim();
    const pass = document.getElementById("login-password").value;
    if (!email || !pass) {
        showError("Please enter your email and password.");
        return;
    }
    if (!auth) {
        showError("Firebase service unavailable. Check your internet connection.");
        return;
    }
    disableButtons(true);
    setLoading("login-loading", true);

    auth.signInWithEmailAndPassword(email, pass)
        .then(res => {
            showSuccess("Authentication successful! Loading dashboard…");
            const payload = formatUser(res.user, "password");
            setTimeout(() => sendToStreamlit(payload), 400);
        })
        .catch(err => {
            console.error("Login error:", err);
            let msg = "Sign in failed.";
            if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
                msg = "Incorrect email or password. Please verify and try again.";
            } else if (err.code === "auth/invalid-email") {
                msg = "Please enter a valid email address.";
            } else if (err.code === "auth/too-many-requests") {
                msg = "Too many failed attempts. Please wait a few moments and try again.";
            } else if (err.message) {
                msg = err.message;
            }
            showError(msg);
        })
        .finally(() => {
            disableButtons(false);
            setLoading("login-loading", false);
        });
}

// Email/Password Signup
function signupEmail() {
    clearMessages();
    const email = document.getElementById("signup-email").value.trim();
    const pass = document.getElementById("signup-password").value;
    const confirm = document.getElementById("signup-confirm").value;

    if (!email || !pass) {
        showError("Please enter all required fields.");
        return;
    }
    if (pass.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
    }
    if (pass !== confirm) {
        showError("Passwords do not match.");
        return;
    }
    if (!auth) {
        showError("Firebase service unavailable.");
        return;
    }

    disableButtons(true);
    setLoading("signup-loading", true);

    auth.createUserWithEmailAndPassword(email, pass)
        .then(res => {
            showSuccess("Account created successfully! Welcome aboard.");
            const payload = formatUser(res.user, "password");
            setTimeout(() => sendToStreamlit(payload), 500);
        })
        .catch(err => {
            console.error("Signup error:", err);
            let msg = "Account creation failed.";
            if (err.code === "auth/email-already-in-use") {
                msg = "An account with this email already exists. Please sign in instead.";
            } else if (err.code === "auth/weak-password") {
                msg = "Password is too weak. Please use numbers and letters.";
            } else if (err.code === "auth/invalid-email") {
                msg = "Please provide a valid email address.";
            } else if (err.message) {
                msg = err.message;
            }
            showError(msg);
        })
        .finally(() => {
            disableButtons(false);
            setLoading("signup-loading", false);
        });
}

// Demo Guest Access
function loginGuest() {
    clearMessages();
    showSuccess("Entering as Guest Analyst…");
    const guestUser = {
        email: "guest.analyst@webannage.ai",
        name: "Guest Analyst",
        uid: "guest-" + Date.now(),
        provider: "demo"
    };
    setTimeout(() => sendToStreamlit(guestUser), 300);
}

// Enter Key Handler
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        if (document.getElementById("login-form").style.display !== "none") loginEmail();
        else signupEmail();
    }
});
</script>
</body>
</html>
