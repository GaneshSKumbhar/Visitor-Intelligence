<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Intelligence — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 8px 0 16px;
  color: #e2e8f0;
}

/* ── Card ── */
.card {
  width: 100%;
  max-width: 440px;
  background: #1a1c2e;
  border: 1px solid #2a2d45;
  border-radius: 16px;
  padding: 28px 28px 24px;
  position: relative;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 16px 16px 0 0;
}

/* ── Header ── */
.header { text-align: center; margin-bottom: 20px; }
.logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px; height: 44px;
  background: #6366f1;
  border-radius: 12px;
  font-size: 16px; font-weight: 700;
  color: #fff;
  margin-bottom: 10px;
}
.header h1 {
  font-size: 18px; font-weight: 700;
  color: #f1f5f9;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.header p {
  font-size: 13px; color: #94a3b8;
  line-height: 1.4;
}

/* ── Google button ── */
.btn-google {
  width: 100%;
  padding: 11px 16px;
  background: #1e293b;
  border: 1px solid #2a2d45;
  border-radius: 10px;
  color: #f1f5f9;
  font-size: 14px; font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: border-color 0.15s, background 0.15s;
  outline: none;
}
.btn-google:hover { border-color: #6366f1; background: #252847; }
.btn-google:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
.btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ── Divider ── */
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0;
  font-size: 12px;
  color: #64748b;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #2a2d45;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  background: #0f1117;
  border: 1px solid #2a2d45;
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 16px;
}
.tab {
  flex: 1;
  padding: 7px 10px;
  font-size: 13px; font-weight: 500;
  color: #64748b;
  cursor: pointer;
  border-radius: 7px;
  border: none;
  background: none;
  font-family: inherit;
  transition: color 0.15s, background 0.15s;
  text-align: center;
}
.tab.active {
  background: #1a1c2e;
  color: #e2e8f0;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

/* ── Form ── */
.form-group { margin-bottom: 12px; }
.form-group label {
  display: block;
  font-size: 12px; font-weight: 500;
  color: #94a3b8;
  margin-bottom: 5px;
}
.form-group input {
  width: 100%;
  padding: 9px 12px;
  background: #0f1117;
  border: 1px solid #2a2d45;
  border-radius: 8px;
  color: #f1f5f9;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.form-group input:focus {
  border-color: #6366f1;
  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}
.form-group input::placeholder { color: #475569; }

/* ── Primary button ── */
.btn-primary {
  width: 100%;
  padding: 10px;
  background: #6366f1;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 14px; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 4px;
  outline: none;
}
.btn-primary:hover { background: #5558e8; }
.btn-primary:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

/* ── Guest button ── */
.btn-guest {
  width: 100%;
  padding: 9px;
  background: transparent;
  border: 1px dashed #2a2d45;
  border-radius: 8px;
  color: #94a3b8;
  font-size: 13px; font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  margin-top: 10px;
  transition: border-color 0.15s, color 0.15s;
  outline: none;
}
.btn-guest:hover { border-color: #6366f1; color: #e2e8f0; }
.btn-guest:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }

/* ── Feedback messages ── */
.error-msg {
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid rgba(248, 113, 113, 0.3);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 12px;
  color: #fca5a5;
  font-size: 13px;
  line-height: 1.4;
  display: none;
}
.success-msg {
  background: rgba(52, 211, 153, 0.1);
  border: 1px solid rgba(52, 211, 153, 0.3);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 12px;
  color: #6ee7b7;
  font-size: 13px;
  line-height: 1.4;
  display: none;
}

/* ── Loading ── */
.loading { display: none; text-align: center; padding: 6px; color: #94a3b8; font-size: 13px; }
.loading.show { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(99,102,241,0.3);
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

/* ── Footer ── */
.auth-footer {
  text-align: center;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #2a2d45;
  font-size: 11px;
  color: #475569;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">VI</div>
    <h1>Sign in to Visitor Intelligence</h1>
    <p>Purchase intent analytics platform</p>
  </div>

  <div id="error-box" class="error-msg"></div>
  <div id="success-box" class="success-msg"></div>

  <!-- Google sign-in -->
  <button class="btn-google" id="btn-google" onclick="loginGoogle()">
    <svg viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continue with Google
  </button>

  <div class="divider">or use email</div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
    <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create account</button>
  </div>

  <!-- Sign-in form -->
  <div id="login-form">
    <div class="form-group">
      <label for="login-email">Email address</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="login-loading" class="loading"><span class="spinner"></span>Signing in…</div>
    <button class="btn-primary" id="btn-login" onclick="loginEmail()">Sign in</button>
  </div>

  <!-- Sign-up form -->
  <div id="signup-form" style="display:none">
    <div class="form-group">
      <label for="signup-email">Email address</label>
      <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="signup-password">Password (min. 6 characters)</label>
      <input type="password" id="signup-password" placeholder="Create a password" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="signup-confirm">Confirm password</label>
      <input type="password" id="signup-confirm" placeholder="Repeat password" autocomplete="new-password">
    </div>
    <div id="signup-loading" class="loading"><span class="spinner"></span>Creating account…</div>
    <button class="btn-primary" id="btn-signup" onclick="signupEmail()">Create account</button>
  </div>

  <!-- Demo access -->
  <button class="btn-guest" onclick="loginGuest()">Try demo access (no sign-in required)</button>

  <div class="auth-footer">
    Secured by Google Firebase Authentication
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBWlZmKjZbFcVMgfYQaY8G2gE38PgyhnxQ",
  authDomain: "webannage.firebaseapp.com",
  projectId: "webannage",
  storageBucket: "webannage.firebasestorage.app",
  messagingSenderId: "277770633307",
  appId: "1:277770633307:web:3314be2367407891693f7e",
  measurementId: "G-L22JWPZNQK"
};

let auth = null;
try {
  if (window.firebase) {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
  }
} catch(e) { console.warn("Firebase init:", e); }

// ── Streamlit communication ──
function sendToStreamlit(value) {
  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value }, "*");
}
function sendHeight() {
  const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 24;
  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*");
}
function notifyReady() {
  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  sendHeight();
}
window.addEventListener("message", function(e) {
  if (e.data && e.data.type === "streamlit:render") {
    sendHeight();
    if (e.data.args && e.data.args.logout_signal) handleSignOut();
  }
});
document.addEventListener("DOMContentLoaded", () => { notifyReady(); setTimeout(sendHeight, 150); });
window.addEventListener("load", () => { notifyReady(); setTimeout(sendHeight, 200); });
window.addEventListener("resize", sendHeight);

// ── Sign-out ──
function handleSignOut() {
  try { if (auth) auth.signOut(); } catch(e) {}
  try { localStorage.removeItem("vi_auth_user"); sessionStorage.removeItem("vi_auth_user"); } catch(e) {}
  clearMessages();
  disableButtons(false);
}

// ── UI helpers ──
function showError(msg) {
  const b = document.getElementById("error-box");
  b.textContent = msg; b.style.display = "block";
  document.getElementById("success-box").style.display = "none";
  sendHeight();
}
function showSuccess(msg) {
  const b = document.getElementById("success-box");
  b.textContent = msg; b.style.display = "block";
  document.getElementById("error-box").style.display = "none";
  sendHeight();
}
function clearMessages() {
  document.getElementById("error-box").style.display = "none";
  document.getElementById("success-box").style.display = "none";
}
function setLoading(id, show) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle("show", show);
}
function disableButtons(d) {
  document.querySelectorAll(".btn-primary, .btn-google, .btn-guest").forEach(b => b.disabled = d);
}
function switchTab(mode) {
  clearMessages();
  document.getElementById("tab-login").classList.toggle("active", mode === "login");
  document.getElementById("tab-signup").classList.toggle("active", mode === "signup");
  document.getElementById("login-form").style.display = mode === "login" ? "block" : "none";
  document.getElementById("signup-form").style.display = mode === "signup" ? "block" : "none";
  sendHeight();
}
function formatUser(u, provider) {
  return {
    email: u.email || "",
    name: u.displayName || (u.email ? u.email.split("@")[0] : "User"),
    uid: u.uid || "",
    photo: u.photoURL || null,
    provider: provider || (u.providerData && u.providerData[0] ? u.providerData[0].providerId : "password")
  };
}

// ── Google sign-in ──
function loginGoogle() {
  clearMessages();
  if (!auth) { showError("Firebase is not available. Please use email sign-in instead."); return; }
  disableButtons(true);
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  auth.signInWithPopup(provider)
    .then(result => {
      showSuccess("Signed in with Google. Loading…");
      setTimeout(() => sendToStreamlit(formatUser(result.user, "google.com")), 400);
    })
    .catch(err => {
      if (err.code === "auth/popup-closed-by-user") showError("Sign-in popup closed. Please try again.");
      else if (err.code === "auth/popup-blocked") showError("Popup blocked. Allow popups for this page or use email sign-in.");
      else if (err.code === "auth/unauthorized-domain") showError("Domain not authorised. Add localhost in Firebase Console → Authentication → Settings.");
      else showError(err.message || "Google sign-in failed. Please try email sign-in.");
    })
    .finally(() => disableButtons(false));
}

// ── Email sign-in ──
function loginEmail() {
  clearMessages();
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-password").value;
  if (!email || !pass) { showError("Enter your email and password."); return; }
  if (!auth) { showError("Firebase unavailable. Check your internet connection."); return; }
  disableButtons(true);
  setLoading("login-loading", true);
  auth.signInWithEmailAndPassword(email, pass)
    .then(res => {
      showSuccess("Signed in. Loading your workspace…");
      setTimeout(() => sendToStreamlit(formatUser(res.user, "password")), 400);
    })
    .catch(err => {
      const codes = {
        "auth/user-not-found": "No account found with this email. Create an account or check the address.",
        "auth/wrong-password": "Incorrect password.",
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/invalid-email": "Enter a valid email address.",
        "auth/too-many-requests": "Too many failed attempts. Wait a few minutes and try again."
      };
      showError(codes[err.code] || err.message || "Sign-in failed.");
    })
    .finally(() => { disableButtons(false); setLoading("login-loading", false); });
}

// ── Email sign-up ──
function signupEmail() {
  clearMessages();
  const email = document.getElementById("signup-email").value.trim();
  const pass = document.getElementById("signup-password").value;
  const confirm = document.getElementById("signup-confirm").value;
  if (!email || !pass) { showError("Fill in all fields."); return; }
  if (pass.length < 6) { showError("Password must be at least 6 characters."); return; }
  if (pass !== confirm) { showError("Passwords do not match."); return; }
  if (!auth) { showError("Firebase unavailable."); return; }
  disableButtons(true);
  setLoading("signup-loading", true);
  auth.createUserWithEmailAndPassword(email, pass)
    .then(res => {
      showSuccess("Account created. Loading your workspace…");
      setTimeout(() => sendToStreamlit(formatUser(res.user, "password")), 500);
    })
    .catch(err => {
      const codes = {
        "auth/email-already-in-use": "An account with this email already exists. Sign in instead.",
        "auth/weak-password": "Password is too weak. Use a mix of letters and numbers.",
        "auth/invalid-email": "Enter a valid email address."
      };
      showError(codes[err.code] || err.message || "Account creation failed.");
    })
    .finally(() => { disableButtons(false); setLoading("signup-loading", false); });
}

// ── Demo / guest access ──
function loginGuest() {
  clearMessages();
  showSuccess("Entering as guest analyst…");
  const guest = { email: "guest.analyst@webannage.ai", name: "Guest Analyst", uid: "guest-" + Date.now(), provider: "demo" };
  setTimeout(() => sendToStreamlit(guest), 300);
}

// Enter key
document.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const loginVisible = document.getElementById("login-form").style.display !== "none";
    if (loginVisible) loginEmail(); else signupEmail();
  }
});
</script>
</body>
</html>
